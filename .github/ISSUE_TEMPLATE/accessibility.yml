name: Accessibility barrier
description: Something in an EPUB, the docs or the project page is hard to use with your setup
labels: [accessibility]
body:
  - type: textarea
    id: barrier
    attributes:
      label: What is the barrier?
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Reading app or device, assistive technology (screen reader, magnifier, etc.), theme or font settings.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not attached or pasted any copyrighted book text, PDF, EPUB or personal data.
          required: true
