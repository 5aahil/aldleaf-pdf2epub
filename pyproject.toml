[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2epub-kit"
version = "0.1.0"
description = "Turn text-based PDF books into clean, validated, accessible EPUB 3 for Apple Books and Kindle."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.23", "pyyaml>=6"]
keywords = ["epub", "pdf", "ebook", "kindle", "apple books", "self-publishing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
visual = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
pdf2epub = "pdf2epub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
