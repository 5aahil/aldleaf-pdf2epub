    <rect x="768" y="332" width="144" height="6" rx="2"/><rect x="768" y="346" width="90" height="6" rx="2"/>
    <rect x="768" y="366" width="144" height="6" rx="2"/><rect x="768" y="380" width="144" height="6" rx="2"/>
    <rect x="768" y="394" width="120" height="6" rx="2"/>
  </g>
  <!-- phone dark -->
  <g filter="url(#sh)">
