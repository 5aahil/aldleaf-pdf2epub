  <g transform="translate(1042 292)"><rect width="36" height="36" fill="none" stroke="#e8e3da" stroke-width="3"/><circle cx="18" cy="18" r="11" fill="#e8e3da"/><circle cx="18" cy="18" r="5" fill="#8f8a83"/></g>
  <g fill="#cfc8bb">
    <rect x="988" y="344" width="144" height="6" rx="2"/><rect x="988" y="358" width="144" height="6" rx="2"/>
    <rect x="988" y="372" width="144" height="6" rx="2"/><rect x="988" y="386" width="90" height="6" rx="2"/>
    <rect x="988" y="406" width="144" height="6" rx="2"/><rect x="988" y="420" width="144" height="6" rx="2"/>
