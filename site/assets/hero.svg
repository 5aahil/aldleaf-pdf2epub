    <rect x="112" y="214" width="226" height="7" rx="2"/><rect x="100" y="232" width="238" height="7" rx="2"/>
    <rect x="100" y="250" width="200" height="7" rx="2"/>
  </g>
  <rect x="100" y="276" width="140" height="26" rx="5" fill="#ebe7e0"/>
  <rect x="200" y="312" width="140" height="26" rx="5" fill="#555"/>
  <g fill="#3a352e">
    <rect x="112" y="356" width="226" height="7" rx="2"/><rect x="100" y="374" width="238" height="7" rx="2"/>
    <rect x="100" y="392" width="238" height="7" rx="2"/><rect x="100" y="410" width="120" height="7" rx="2"/>
  </g>
  <text x="220" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9a9184">42</text>
  <circle cx="220" cy="465" r="17" fill="none" stroke="#e0a43a" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="220" y="526" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#6d665b">PDF: fixed print layout</text>

  <!-- pipeline -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#1d1b18">
    <g transform="translate(420 150)">
      <rect width="190" height="46" rx="23" fill="#fff" stroke="#1d1b18" stroke-width="2"/><text x="95" y="29" text-anchor="middle">1 analyze</text>
    </g>
    <g transform="translate(420 214)">
      <rect width="190" height="46" rx="23" fill="#fff" stroke="#1d1b18" stroke-width="2"/><text x="95" y="29" text-anchor="middle">2 confirm</text>
    </g>
    <g transform="translate(420 278)">
      <rect width="190" height="46" rx="23" fill="#fff" stroke="#1d1b18" stroke-width="2"/><text x="95" y="29" text-anchor="middle">3 build</text>
    </g>
    <g transform="translate(420 342)">
      <rect width="190" height="46" rx="23" fill="#2f6f73" stroke="#1d1b18" stroke-width="2"/><text x="95" y="29" text-anchor="middle" fill="#fff">4 check ✓</text>
    </g>
  </g>
  <path d="M630 270 H690" stroke="#e0a43a" stroke-width="7" stroke-linecap="round"/>
  <path d="M690 254 L716 270 L690 286 Z" fill="#e0a43a"/>

