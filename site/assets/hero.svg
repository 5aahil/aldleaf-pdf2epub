<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="ht hd">
  <title id="ht">pdf2epub-kit: from a fixed PDF page to a reflowing ebook</title>
  <desc id="hd">A print page with running head, page number and hard line breaks is analysed, confirmed, built and checked, then shown as an ebook in a light and a dark reader theme.</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1200" height="560" fill="#fbf8f2"/>
  <!-- PDF page -->
  <g filter="url(#sh)">
    <rect x="70" y="70" width="300" height="420" rx="6" fill="#fff" stroke="#d9d2c4"/>
  </g>
  <text x="220" y="104" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#9a9184">Running Head</text>
  <line x1="95" y1="114" x2="345" y2="114" stroke="#e0a43a" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#3a352e">
